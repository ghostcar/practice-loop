{% extends "base.html" %}

{% block content %}
<div>
 <div class="flex items-center justify-between mb-8">
 <div>
 <h1 class="text-3xl font-bold text-[color:var(--text)]">
 {{ t.dashboard_title }}
 </h1>
 <p class="text-[color:var(--text-secondary)] mt-1">
 {{ t.dashboard_welcome }}
 </p>
 </div>
 </div>

 <!-- Stats placeholder cards -->
 <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
 <div class="p-6 rounded-2xl pl-surface border border-[color:var(--border)]">
 <div class="text-2xl font-bold text-[color:var(--text)]">0</div>
 <div class="text-sm text-[color:var(--text-secondary)]">XP</div>
 </div>
 <div class="p-6 rounded-2xl pl-surface border border-[color:var(--border)]">
 <div class="text-2xl font-bold text-[color:var(--text)]">0</div>
 <div class="text-sm text-[color:var(--text-secondary)]">Day streak</div>
 </div>
 <div class="p-6 rounded-2xl pl-surface border border-[color:var(--border)]">
 <div class="text-2xl font-bold text-[color:var(--text)]">0</div>
 <div class="text-sm text-[color:var(--text-secondary)]">Tasks completed</div>
 </div>
 </div>

 <!-- Placeholder for future phases -->
 <div class="p-8 rounded-2xl pl-surface-soft border border-dashed border-[color:var(--border)] text-center">
 <p class="text-[color:var(--text-muted)] text-lg">
 {{ t.dashboard_stats }}
 </p>
 <p class="text-sm text-[color:var(--text-muted)] mt-2">
 Sessions, achievements, and activity log — coming in Phase 4
 </p>
 </div>
</div>
{% endblock %}
