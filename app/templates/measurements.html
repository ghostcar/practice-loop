{% extends "base.html" %}
{% block title %}{{ t.get('measurements_title', 'Body Measurements') }}{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-5">
  <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">{{ t.get('measurements_title', 'Body Measurements') }}</h1>

  <!-- Add form -->
  <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-5">
    <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-200 mb-4">New Measurement</h2>
    <form id="meas-form" class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div><label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">Date</label><input type="date" id="meas-date" class="w-full bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700"></div>
      <div><label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">Time</label><select id="meas-tod" class="w-full bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700"><option value="morning">Morning</option><option value="evening">Evening</option></select></div>
      <div><label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">Weight (kg)</label><input type="number" step="0.1" id="meas-weight" placeholder="98.5" class="w-full bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700"></div>
      <div><label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">Chest (cm)</label><input type="number" step="0.1" id="meas-chest" placeholder="112" class="w-full bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700"></div>
      <div><label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">Under Chest</label><input type="number" step="0.1" id="meas-ucherst" placeholder="100" class="w-full bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700"></div>
      <div><label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">Waist</label><input type="number" step="0.1" id="meas-waist" placeholder="100" class="w-full bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700"></div>
      <div><label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">Hips</label><input type="number" step="0.1" id="meas-hips" placeholder="106" class="w-full bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700"></div>
      <div><label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">Thigh</label><input type="number" step="0.1" id="meas-thigh" placeholder="61" class="w-full bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700"></div>
      <div class="col-span-full"><button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg text-sm font-medium transition-colors">Save</button></div>
    </form>
  </div>

  <!-- Chart -->
  <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4">
    <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Trend</h3>
        <span id="trend-indicator" class="text-xs px-2 py-1 rounded-full font-medium"></span>
    </div>
    <div class="flex gap-1.5 mb-3 flex-wrap">
      <button onclick="loadChart('weight')" class="chart-btn px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium transition-colors">Weight</button>
      <button onclick="loadChart('chest')" class="chart-btn px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium transition-colors">Chest</button>
      <button onclick="loadChart('waist')" class="chart-btn px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium transition-colors">Waist</button>
      <button onclick="loadChart('hips')" class="chart-btn px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium transition-colors">Hips</button>
      <button onclick="loadChart('thigh')" class="chart-btn px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium transition-colors">Thigh</button>
    </div>
    <div class="h-52"><canvas id="meas-chart"></canvas></div>
  </div>

  <!-- History table -->
  <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
        <tr><th class="px-4 py-2.5 text-left font-medium">Date</th><th class="px-4 py-2.5 text-left font-medium">Time</th><th class="px-4 py-2.5 text-right font-medium">Weight</th><th class="px-4 py-2.5 text-right font-medium">Chest</th><th class="px-4 py-2.5 text-right font-medium">Waist</th><th class="px-4 py-2.5 text-right font-medium">Hips</th><th class="px-4 py-2.5 text-right font-medium">Thigh</th></tr>
      </thead>
      <tbody id="meas-table" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let chart;
Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
Chart.defaults.font.size = 11;

async function loadMeasurements() {
  const res = await fetch('/api/v2/measurements?limit=60');
  const data = await res.json();
  document.getElementById('meas-table').innerHTML = data.map(m =>
    `<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
      <td class="px-4 py-2 text-slate-700 dark:text-slate-300">${m.measured_date}</td>
      <td class="px-4 py-2 text-slate-500 dark:text-slate-400">${m.time_of_day}</td>
      <td class="px-4 py-2 text-right text-slate-700 dark:text-slate-300 tabular-nums">${m.weight ?? '—'}</td>
      <td class="px-4 py-2 text-right text-slate-700 dark:text-slate-300 tabular-nums">${m.chest ?? '—'}</td>
      <td class="px-4 py-2 text-right text-slate-700 dark:text-slate-300 tabular-nums">${m.waist ?? '—'}</td>
      <td class="px-4 py-2 text-right text-slate-700 dark:text-slate-300 tabular-nums">${m.hips ?? '—'}</td>
      <td class="px-4 py-2 text-right text-slate-700 dark:text-slate-300 tabular-nums">${m.thigh ?? '—'}</td>
    </tr>`
  ).join('') || '<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400">No measurements yet</td></tr>';
}

async function loadChart(metric) {
  document.querySelectorAll('.chart-btn').forEach(b => { b.classList.remove('bg-indigo-600','text-white'); b.classList.add('bg-slate-100','dark:bg-slate-800'); });
  event.target.classList.add('bg-indigo-600','text-white');
  event.target.classList.remove('bg-slate-100','dark:bg-slate-800');
  const res = await fetch(`/api/v2/measurements/charts?metric=${metric}&limit=60`);
  const data = await res.json();
  const ctx = document.getElementById('meas-chart').getContext('2d');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.labels,
      datasets: [
        { label: 'Morning', data: data.morning, borderColor: '#6B57A5', backgroundColor: 'rgba(107,87,165,0.08)', fill: true, tension: 0.3, pointRadius: 2, spanGaps: true },
        { label: 'Evening', data: data.evening, borderColor: '#356A9A', backgroundColor: 'rgba(53,106,154,0.06)', fill: true, tension: 0.3, pointRadius: 2, spanGaps: true }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { labels: { color: '#94a3b8', usePointStyle: true, padding: 16, font: { size: 11 } } },
        tooltip: { backgroundColor: '#1E293B', titleColor: '#F8FAFC', bodyColor: '#CBD5E1', padding: 8, cornerRadius: 6 }
      },
      scales: {
        x: { ticks: { color: '#94a3b8', maxTicksLimit: 12, font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: 'rgba(148,163,184,0.12)' } }
      }
    }
  });

  const morningVals = data.morning.filter(v => v !== null);
  if (morningVals.length >= 2) {
    const first = morningVals.slice(0, 3).reduce((a,b) => a + (b||0), 0) / 3;
    const last = morningVals.slice(-3).reduce((a,b) => a + (b||0), 0) / 3;
    const delta = last - first;
    const indicator = document.getElementById('trend-indicator');
    if (Math.abs(delta) < 0.5) {
        indicator.textContent = 'stable';
        indicator.className = 'text-xs px-2 py-1 rounded-full font-medium bg-slate-100 dark:bg-slate-800 text-slate-500';
    } else if ((metric === 'weight' && delta < 0) || (metric !== 'weight' && delta > 0)) {
        indicator.textContent = 'improving';
        indicator.className = 'text-xs px-2 py-1 rounded-full font-medium bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300';
    } else {
        indicator.textContent = 'watch it';
        indicator.className = 'text-xs px-2 py-1 rounded-full font-medium bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300';
    }
  }
}

document.getElementById('meas-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    measured_date: document.getElementById('meas-date').value,
    time_of_day: document.getElementById('meas-tod').value,
    weight: parseFloatOrNull('meas-weight'), chest: parseFloatOrNull('meas-chest'),
    under_chest: parseFloatOrNull('meas-ucherst'), waist: parseFloatOrNull('meas-waist'),
    hips: parseFloatOrNull('meas-hips'), thigh: parseFloatOrNull('meas-thigh'),
  };
  await fetch('/api/v2/measurements', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  loadMeasurements();
});
function parseFloatOrNull(id) { const v = document.getElementById(id).value; return v ? parseFloat(v) : null; }
document.getElementById('meas-date').value = new Date().toISOString().split('T')[0];
loadMeasurements();
loadChart('weight');
</script>
{% endblock %}
