{% extends "base.html" %}
{% block title %}Schedule{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-5">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Weekly Schedule</h1>
    <div class="flex gap-2">
      <a href="/calendar" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">Calendar</a>
      <button onclick="showForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">+ Add Rule</button>
    </div>
  </div>

  <!-- Add form -->
  <div id="add-form" class="hidden bg-white dark:bg-slate-900 rounded-xl p-4 border border-slate-200 dark:border-slate-800">
    <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-3">New Schedule Rule</h3>
    <form id="sched-form" class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <select id="sched-dow" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 text-sm">
        <option value="7">Every Day</option><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option>
      </select>
      <input id="sched-start" type="time" value="06:00" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 text-sm">
      <input id="sched-end" type="time" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 text-sm">
      <select id="sched-type" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 text-sm">
        <option value="mandatory">Mandatory</option><option value="optional_mandatory">Opt-Mandatory</option><option value="optional">Optional</option><option value="penalty_reducing">Penalty Red.</option>
      </select>
      <input id="sched-entity" placeholder="Entity name" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 text-sm col-span-2">
      <input id="sched-notes" placeholder="Notes" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 text-sm col-span-2">
      <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300"><input type="checkbox" id="sched-recur" checked> Recurring</label>
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm col-span-full transition-colors">Save</button>
    </form>
  </div>

  <!-- Weekly Timeline Chart -->
  <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4">
    <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-3">Weekly Timeline</h3>
    <div class="h-64"><canvas id="week-timeline"></canvas></div>
  </div>

  <!-- Today's schedule -->
  <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
    <div class="bg-slate-100 dark:bg-slate-800 px-4 py-2 font-semibold text-sm text-slate-700 dark:text-slate-200">Today's Schedule</div>
    <div id="today-sched" class="p-3 space-y-2"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const TYPE_COLORS = {mandatory:'#A83B4A',optional_mandatory:'#9A6415',optional:'#2F7657',penalty_reducing:'#356A9A'};

let timelineChart = null;

async function loadAll() {
  const todayRes = await fetch('/api/v2/schedule/today');
  const todayRules = await todayRes.json();
  const el = document.getElementById('today-sched');
  if (!todayRules.length) { el.innerHTML = '<p class="text-slate-400 dark:text-slate-500 text-center py-4 text-sm">No rules for today.</p>'; }
  else {
    el.innerHTML = todayRules.map(r => `
      <div class="flex items-center gap-3 p-2 rounded-lg border-l-4" style="border-left-color:${TYPE_COLORS[r.task_type] || '#94a3b8'}">
        <span class="text-xs font-mono text-slate-400 w-24 tabular-nums">${r.start_time}${r.end_time ? ' – ' + r.end_time : ''}</span>
        <span class="flex-1 text-sm text-slate-700 dark:text-slate-300">${escapeHtml(String(r.entity_name || r.notes || '—'))}</span>
        <span class="text-xs px-2 py-0.5 rounded font-medium" style="background:${TYPE_COLORS[r.task_type]}18;color:${TYPE_COLORS[r.task_type]}">${escapeHtml(r.task_type)}</span>
      </div>
    `).join('');
  }
  loadTimeline(todayRules);
}

function loadTimeline(todayRules) {
  const ctx = document.getElementById('week-timeline').getContext('2d');
  if (timelineChart) timelineChart.destroy();

  const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const byDay = {};
  for (const r of todayRules) {
    const dow = r.day_of_week === 7 ? 'all' : r.day_of_week;
    if (!byDay[dow]) byDay[dow] = [];
    byDay[dow].push(r);
  }

  const colorPalette = ['#6B57A5','#2F7657','#9A6415','#A83B4A','#356A9A','#B8A3EE','#71C89D'];
  const datasets = [];
  for (let dow = 0; dow < 7; dow++) {
    const rules = (byDay[dow] || []).concat(byDay['all'] || []);
    if (rules.length === 0) continue;
    datasets.push({
      label: dayLabels[dow],
      data: rules.map(r => {
        const [sh, sm] = (r.start_time || '00:00').split(':').map(Number);
        const [eh, em] = (r.end_time || '23:59').split(':').map(Number);
        return { x: [sh * 60 + sm, eh * 60 + em], y: dayLabels[dow], name: r.entity_name || r.notes || '', type: r.task_type };
      }),
      backgroundColor: colorPalette[dow] + '99',
      borderColor: colorPalette[dow],
      borderWidth: 1,
      borderRadius: 4,
    });
  }

  timelineChart = new Chart(ctx, {
    type: 'bar',
    data: { datasets },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#94a3b8', font: { size: 10 }, usePointStyle: true, padding: 12 } },
        tooltip: {
          backgroundColor: '#1E293B',
          titleColor: '#F8FAFC',
          bodyColor: '#CBD5E1',
          padding: 8,
          cornerRadius: 6,
          callbacks: {
            label: ctx => {
              const d = ctx.raw;
              const sh = Math.floor(d.x[0] / 60), sm = d.x[0] % 60;
              const eh = Math.floor(d.x[1] / 60), em = d.x[1] % 60;
              return `${d.name || 'Rule'}: ${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')} - ${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
            }
          }
        }
      },
      scales: {
        x: { type: 'linear', min: 0, max: 1440,
          ticks: { color: '#94a3b8', font: { size: 9 }, stepSize: 120, callback: v => `${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}` },
          grid: { color: 'rgba(148,163,184,0.12)' } },
        y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { display: false } }
      }
    }
  });
}

function showForm() { document.getElementById('add-form').classList.toggle('hidden'); }
document.getElementById('sched-form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {
    day_of_week: parseInt(document.getElementById('sched-dow').value),
    start_time: document.getElementById('sched-start').value,
    end_time: document.getElementById('sched-end').value || null,
    task_type: document.getElementById('sched-type').value,
    notes: document.getElementById('sched-notes').value || null,
    recurring: document.getElementById('sched-recur').checked,
  };
  const entity = document.getElementById('sched-entity').value.trim();
  if (entity) body.entity_name = entity;
  await fetch('/api/v2/schedule/rules', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  document.getElementById('add-form').classList.add('hidden');
  loadAll();
});
loadAll();
</script>
{% endblock %}
