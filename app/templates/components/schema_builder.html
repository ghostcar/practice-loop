<!-- Interactive Visual Parameter Schema Builder Component (Step 25) -->
<div id="schema-builder-root" class="pl-surface rounded-xl border border-[color:var(--border)] p-6 space-y-6">
  <div class="flex items-center justify-between border-b border-[color:var(--border)] pb-4">
    <div>
      <h3 class="text-base font-semibold text-[color:var(--text)]">{{ icon('tools', 'w-5 h-5') }} Визуальный Конструктор Схемы Параметров</h3>
      <p class="text-xs text-[color:var(--text-secondary)]">Интерактивное создание ползунков, диапазонов, чекбоксов и диапазонов длительности.</p>
    </div>
    <button type="button" id="sb-add-field-btn" class="px-3 py-1.5 pl-accent-bg hover:bg-[color:var(--accent-hover)] text-xs font-medium rounded-lg">
      + Добавить Параметр
    </button>
  </div>

  <!-- Fields List Container -->
  <div id="sb-fields-container" class="space-y-4">
    <!-- Fields dynamically rendered by JS -->
  </div>

  <!-- Live Preview Container -->
  <div class="border-t border-[color:var(--border)] pt-5">
    <h4 class="text-xs font-semibold text-[color:var(--text-secondary)] uppercase tracking-wider mb-3">{{ icon('eye', 'w-4 h-4') }} Предпросмотр формы параметров:</h4>
    <div id="sb-live-preview" class="p-4 bg-[color:var(--surface-soft)] rounded-lg border border-[color:var(--border)] min-h-[60px]">
      <p class="text-xs text-[color:var(--text-muted)]">Добавьте хотя бы один параметр для генерации интерфейса.</p>
    </div>
  </div>

  <!-- Hidden Form Control storing JSON -->
  <input type="hidden" name="params_schema_json" id="sb-output-json" value="{}">
</div>

<script nonce="{{ csp_nonce }}">
document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('sb-fields-container');
  const addBtn = document.getElementById('sb-add-field-btn');
  const preview = document.getElementById('sb-live-preview');
  const outputJson = document.getElementById('sb-output-json');

  let fields = [];

  function render() {
    container.innerHTML = '';
    if (fields.length === 0) {
      container.innerHTML = '<p class="text-xs text-[color:var(--text-muted)] italic">Нет добавленных параметров.</p>';
    }

    const schemaObj = { type: 'object', properties: {} };

    fields.forEach((f, idx) => {
      const card = document.createElement('div');
      card.className = 'p-4 rounded-lg bg-[color:var(--surface-soft)] border border-[color:var(--border)] space-y-3';
      card.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <input type="text" placeholder="Имя переменной (напр. duration_minutes)" value="${f.key}" 
            class="px-2.5 py-1 text-xs rounded border border-[color:var(--border)] bg-[color:var(--surface)] text-[color:var(--text)] font-mono w-1/3 field-key" data-idx="${idx}">
          <select class="px-2.5 py-1 text-xs rounded border border-[color:var(--border)] bg-[color:var(--surface)] text-[color:var(--text)] field-type" data-idx="${idx}">
            <option value="range" ${f.type === 'range' ? 'selected' : ''}>Ползунок / Диапазон (Range)</option>
            <option value="number" ${f.type === 'number' ? 'selected' : ''}>Число (Number)</option>
            <option value="boolean" ${f.type === 'boolean' ? 'selected' : ''}>Чекбокс (Boolean)</option>
            <option value="text" ${f.type === 'text' ? 'selected' : ''}>Текст (Text)</option>
          </select>
          <button type="button" class="text-xs text-red-400 hover:text-red-300 field-remove" data-idx="${idx}">Удалить</button>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <input type="text" placeholder="Заголовок (Label)" value="${f.label}" class="px-2 py-1 text-xs rounded border border-[color:var(--border)] bg-[color:var(--surface)] text-[color:var(--text)] field-label" data-idx="${idx}">
          <input type="number" placeholder="Мин (Min)" value="${f.min ?? ''}" class="px-2 py-1 text-xs rounded border border-[color:var(--border)] bg-[color:var(--surface)] text-[color:var(--text)] field-min" data-idx="${idx}">
          <input type="number" placeholder="Макс (Max)" value="${f.max ?? ''}" class="px-2 py-1 text-xs rounded border border-[color:var(--border)] bg-[color:var(--surface)] text-[color:var(--text)] field-max" data-idx="${idx}">
        </div>
      `;
      container.appendChild(card);

      // Build JSON Schema object
      schemaObj.properties[f.key || `param_${idx}`] = {
        type: f.type === 'range' || f.type === 'number' ? 'number' : (f.type === 'boolean' ? 'boolean' : 'string'),
        title: f.label || f.key,
        minimum: f.min ? Number(f.min) : undefined,
        maximum: f.max ? Number(f.max) : undefined
      };
    });

    outputJson.value = JSON.stringify(schemaObj, null, 2);
    renderPreview(fields);
  }

  function renderPreview(fieldList) {
    if (fieldList.length === 0) {
      preview.innerHTML = '<p class="text-xs text-[color:var(--text-muted)]">Добавьте параметры выше.</p>';
      return;
    }
    preview.innerHTML = fieldList.map(f => {
      if (f.type === 'range') {
        return `<div class="mb-2"><label class="block text-xs font-medium text-[color:var(--text)] mb-1">${f.label || f.key} (${f.min || 0} .. ${f.max || 100})</label><input type="range" min="${f.min || 0}" max="${f.max || 100}" class="w-full"></div>`;
      } else if (f.type === 'boolean') {
        return `<div class="flex items-center gap-2 mb-2"><input type="checkbox" id="prev_${f.key}"><label for="prev_${f.key}" class="text-xs text-[color:var(--text)]">${f.label || f.key}</label></div>`;
      } else {
        return `<div class="mb-2"><label class="block text-xs font-medium text-[color:var(--text)] mb-1">${f.label || f.key}</label><input type="text" placeholder="${f.label}" class="w-full px-2 py-1 text-xs rounded border border-[color:var(--border)] bg-[color:var(--surface)]"></div>`;
      }
    }).join('');
  }

  if (addBtn) {
    addBtn.addEventListener('click', () => {
      fields.push({ key: `param_${fields.length + 1}`, type: 'range', label: 'Длительность (мин)', min: 5, max: 60 });
      render();
    });
  }

  container.addEventListener('input', (e) => {
    const idx = e.target.dataset.idx;
    if (idx === undefined) return;
    if (e.target.classList.contains('field-key')) fields[idx].key = e.target.value;
    if (e.target.classList.contains('field-label')) fields[idx].label = e.target.value;
    if (e.target.classList.contains('field-min')) fields[idx].min = e.target.value;
    if (e.target.classList.contains('field-max')) fields[idx].max = e.target.value;
    render();
  });

  container.addEventListener('change', (e) => {
    const idx = e.target.dataset.idx;
    if (idx === undefined) return;
    if (e.target.classList.contains('field-type')) fields[idx].type = e.target.value;
    render();
  });

  container.addEventListener('click', (e) => {
    if (e.target.classList.contains('field-remove')) {
      const idx = Number(e.target.dataset.idx);
      fields.splice(idx, 1);
      render();
    }
  });

  render();
});
</script>
