{% extends "base.html" %}
{% block title %}Inventory{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-4">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">{{ t.get('inventory_title', 'Inventory') }}</h1>
    <div class="flex gap-2">
      <button onclick="showForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">+ Add</button>
      <a href="/import/template/inventory" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 px-4 py-2 rounded-lg text-sm transition-colors">Template</a>
    </div>
  </div>

  <!-- Filters -->
  <div class="flex gap-2 mb-6 flex-wrap">
    <button onclick="filter('')" class="filter-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-medium transition-colors">All</button>
    <button onclick="filter('clothing')" class="filter-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-medium transition-colors">Clothing</button>
    <button onclick="filter('equipment')" class="filter-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-medium transition-colors">Equipment</button>
    <button onclick="filter('cosmetics')" class="filter-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-medium transition-colors">Cosmetics</button>
    <button onclick="filterShoppingList()" class="filter-btn px-3 py-1.5 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 hover:bg-amber-100 dark:hover:bg-amber-950/50 text-sm font-medium transition-colors">Shopping List</button>
  </div>

  <!-- Add form (hidden) -->
  <div id="add-form" class="hidden bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-5 mb-6">
    <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-3">New Item</h3>
    <form id="inv-form" class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <input id="inv-cat" placeholder="category" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <input id="inv-name" placeholder="name" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 col-span-2">
      <input id="inv-qty" type="number" placeholder="qty" value="1" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <input id="inv-qtyn" type="number" placeholder="qty needed" value="1" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <select id="inv-status" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
        <option value="need">Need</option><option value="ordered">Ordered</option><option value="bought">Bought</option><option value="built">Built</option>
      </select>
      <input id="inv-prio" type="number" placeholder="priority" value="0" class="bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2 text-sm text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300 col-span-2"><input type="checkbox" id="inv-shop"> Shopping list</label>
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm col-span-full transition-colors font-medium">Save</button>
    </form>
  </div>

  <!-- Category distribution chart -->
  <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-4 mb-6">
    <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-200">Category Breakdown</h3>
        <span id="inv-total" class="text-xs text-slate-400"></span>
    </div>
    <div class="h-36"><canvas id="inv-chart"></canvas></div>
  </div>

  <!-- List -->
  <div id="inv-list" class="space-y-2"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let currentFilter = '';
async function loadInventory(cat, shopOnly) {
  let url = '/api/v2/inventory?';
  if (cat) url += 'category=' + cat + '&';
  if (shopOnly) url += 'shopping_list=true&';
  const res = await fetch(url);
  const items = await res.json();
  const el = document.getElementById('inv-list');
  el.innerHTML = items.map(i => `
    <div class="bg-white dark:bg-slate-900 rounded-lg p-4 flex justify-between items-center border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 transition-colors">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs px-2 py-0.5 rounded font-medium ${catBadge(i.category)}">${i.category}</span>
          <span class="font-medium text-slate-800 dark:text-slate-100">${i.name}</span>
          <span class="text-xs font-medium ${statusBadge(i.status)}">${i.status}</span>
          ${i.is_shopping_list ? '<span class="text-xs bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300 px-1.5 py-0.5 rounded font-medium">Shopping</span>' : ''}
        </div>
        <div class="text-xs text-slate-400 mt-1">Qty: ${i.quantity}/${i.quantity_needed} &middot; Priority: ${i.priority}</div>
      </div>
      <button onclick="del('${i.id}')" class="text-red-400 hover:text-red-500 text-sm px-2">Delete</button>
    </div>
  `).join('') || '<p class="text-slate-400 dark:text-slate-500 text-center py-8">No items yet.</p>';
}
function catBadge(c) {
  const m = {clothing:'bg-pink-100 text-pink-700 dark:bg-pink-900/30 dark:text-pink-300',equipment:'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300',cosmetics:'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300',other:'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'};
  return m[c] || 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300';
}
function statusBadge(s) {
  const m = {need:'text-red-600 dark:text-red-400',ordered:'text-amber-600 dark:text-amber-400',bought:'text-emerald-600 dark:text-emerald-400',built:'text-emerald-600 dark:text-emerald-400'};
  return m[s] || 'text-slate-400';
}
function filter(c) { currentFilter = c; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('bg-indigo-600')); event.target.classList.add('bg-indigo-600'); loadInventory(c, false); }
function filterShoppingList() { document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('bg-indigo-600')); event.target.classList.add('bg-indigo-600'); loadInventory('', true); }
function showForm() { document.getElementById('add-form').classList.toggle('hidden'); }
async function del(id) { await fetch('/api/v2/inventory/'+id, {method:'DELETE'}); loadInventory(currentFilter, false); }
document.getElementById('inv-form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {
    category: document.getElementById('inv-cat').value,
    name: document.getElementById('inv-name').value,
    quantity: parseInt(document.getElementById('inv-qty').value) || 1,
    quantity_needed: parseInt(document.getElementById('inv-qtyn').value) || 1,
    status: document.getElementById('inv-status').value,
    priority: parseInt(document.getElementById('inv-prio').value) || 0,
    is_shopping_list: document.getElementById('inv-shop').checked,
  };
  await fetch('/api/v2/inventory', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  document.getElementById('add-form').classList.add('hidden');
  loadInventory(currentFilter, false);
});
loadInventory('', false);

// Category chart
(async () => {
    try {
        const res = await fetch('/api/v2/inventory');
        const items = await res.json();
        document.getElementById('inv-total').textContent = items.length + ' items';
        const cats = {};
        items.forEach(i => { cats[i.category] = (cats[i.category] || 0) + 1; });
        const colors = { clothing: '#ec4899', equipment: '#3b82f6', cosmetics: '#a855f7', other: '#6b7280' };
        const ctx = document.getElementById('inv-chart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(cats).map(c => c.charAt(0).toUpperCase() + c.slice(1)),
                datasets: [{
                    data: Object.values(cats),
                    backgroundColor: Object.keys(cats).map(c => colors[c] || '#6b7280'),
                    borderRadius: 6,
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#9ca3af', font: { size: 10 } }, grid: { color: '#374151' } },
                    y: { ticks: { color: '#9ca3af', font: { size: 10 } }, grid: { display: false } }
                }
            }
        });
    } catch(e) { console.warn('Inv chart failed:', e); }
})();
</script>
{% endblock %}
