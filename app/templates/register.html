{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-8">
            <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-2">
                {{ t.register_title }}
            </h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">
                {{ t.app_tagline }}
            </p>

            <form action="/auth/register" method="post" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                        {{ t.register_email }}
                    </label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        required
                        autocomplete="email"
                        placeholder="you@example.com"
                        class="w-full px-4 py-3 min-h-[44px] rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                        {{ t.register_password }}
                    </label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                        placeholder="••••••••"
                        class="w-full px-4 py-3 min-h-[44px] rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    >
                    <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">{{ t.auth_min_chars_password }}</p>
                </div>

                <button
                    type="submit"
                    class="w-full py-3 min-h-[44px] rounded-xl bg-indigo-500 hover:bg-indigo-600 text-white font-semibold"
                >
                    {{ t.register_button }}
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
                {{ t.register_have_account }}
                <a href="/login" class="text-indigo-500 hover:text-indigo-400 font-medium transition-colors">
                    {{ t.register_login_link }}
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
