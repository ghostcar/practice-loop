{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
 <div class="w-full max-w-md">
 <div class="pl-surface rounded-2xl border border-[color:var(--border)] p-8">
 <h1 class="text-2xl font-bold text-[color:var(--text)] mb-2">
 {{ t.register_title }}
 </h1>
 <p class="text-sm text-[color:var(--text-secondary)] mb-6">
 {{ t.app_tagline }}
 </p>

 <form action="/auth/register" method="post" class="space-y-4">
 <div>
 <label for="email" class="block text-sm font-medium text-[color:var(--text)] mb-1">
 {{ t.register_email }}
 </label>
 <input
 id="email"
 name="email"
 type="email"
 required
 autocomplete="email"
 placeholder="you@example.com"
 class="w-full px-4 py-3 min-h-[44px] rounded-xl border border-[color:var(--border)] pl-surface-soft text-[color:var(--text)] placeholder-[color:var(--text-muted)] focus:outline-none focus:ring-2 focus:ring-[color:var(--focus)] focus:border-transparent"
 >
 </div>

 <div>
 <label for="password" class="block text-sm font-medium text-[color:var(--text)] mb-1">
 {{ t.register_password }}
 </label>
 <input
 id="password"
 name="password"
 type="password"
 required
 minlength="6"
 autocomplete="new-password"
 placeholder="••••••••"
 class="w-full px-4 py-3 min-h-[44px] rounded-xl border border-[color:var(--border)] pl-surface-soft text-[color:var(--text)] placeholder-[color:var(--text-muted)] focus:outline-none focus:ring-2 focus:ring-[color:var(--focus)] focus:border-transparent"
 >
 <p class="text-xs text-[color:var(--text-muted)] mt-1">{{ t.auth_min_chars_password }}</p>
 </div>

 <button
 type="submit"
 class="w-full py-3 min-h-[44px] rounded-xl pl-accent-bg hover:bg-[color:var(--accent-hover)] font-semibold"
 >
 {{ t.register_button }}
 </button>
 </form>

 <p class="mt-6 text-center text-sm text-[color:var(--text-secondary)]">
 {{ t.register_have_account }}
 <a href="/login" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition-colors">
 {{ t.register_login_link }}
 </a>
 </p>
 </div>
 </div>
</div>
{% endblock %}
