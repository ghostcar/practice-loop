services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-tracker}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?err}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?err}
      APP_ENV: ${APP_ENV:-production}   # production gate: secrets validated at startup
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET:-change-me}
      TG_WEBHOOK_BASE_URL: ${TG_WEBHOOK_BASE_URL:-https://localhost:8443}
      TG_BOT_USERNAME: ${TG_BOT_USERNAME:-practice_loop_bot}
      TG_POLLING: ${TG_POLLING:-false}
      TG_AUTO_ANALYSIS_TIME: ${TG_AUTO_ANALYSIS_TIME:-23:00}
      LOCKTIMER_CORE_ENABLED: ${LOCKTIMER_CORE_ENABLED:-false}
      LOCKTIMER_OWNER_ALLOWLIST: ${LOCKTIMER_OWNER_ALLOWLIST:-}
      CHALLENGE_HMAC_KEY: ${CHALLENGE_HMAC_KEY:-}
      SOCIAL_ENABLED: ${SOCIAL_ENABLED:-false}
      SOCIAL_TRACKER_ADAPTER_ENABLED: ${SOCIAL_TRACKER_ADAPTER_ENABLED:-false}
      SOCIAL_TIMER_ADAPTER_ENABLED: ${SOCIAL_TIMER_ADAPTER_ENABLED:-false}
      SOCIAL_PUBLIC_ENABLED: ${SOCIAL_PUBLIC_ENABLED:-true}
      COMMUNITY_CREATION_LIMIT: ${COMMUNITY_CREATION_LIMIT:-3}
      OMNIROUTE_HOST: ${OMNIROUTE_HOST:-http://host.docker.internal:20128}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/uploads

  # Optional: built-in nginx. Use 'docker compose --profile full up' to start.
  # If you already have host-level nginx + certbot, skip this and proxy to app:8000 directly.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  uploads:
