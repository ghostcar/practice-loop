# Development override — used automatically by 'docker compose up'
# Overrides settings from docker-compose.yml for local development.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app/app:ro         # hot-reload: mount app code
      - ./alembic:/app/alembic:ro # hot-reload: mount migrations
    environment:
      # Use SQLite for local dev (no PostgreSQL needed)
      DATABASE_URL: sqlite+aiosqlite:///./tracker.db
      TG_POLLING: "true"          # polling mode (no webhook URL needed)
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}  # set in .env for Telegram testing
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  # Disable PostgreSQL and nginx for dev
  db:
    profiles: ["prod"]

  nginx:
    profiles: ["prod"]
