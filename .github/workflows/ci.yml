name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & syntax check ──────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff==0.5.7
      - run: ruff check app/ cli.py tests/ seed_prod.py
      - run: ruff format --check app/ cli.py tests/ seed_prod.py

  # ── Unit tests (SQLite, no external services) ────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip setuptools wheel
      - run: pip install ".[dev]"
      - run: python -c "import fastapi, pytest, alembic, httpx, sqlalchemy; print('All deps OK')"
      - run: pytest tests/ -v --tb=short
        env:
          JWT_SECRET_KEY: ci-test-secret-at-least-32-chars-long
          CREDENTIALS_ENCRYPTION_KEY: ci-encryption-key-at-least-32-ch

  # ── Migration roundtrip (PostgreSQL) ─────────────────────────────
  migrations:
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade pip setuptools wheel
      - run: pip install ".[dev]"
      - run: python -c "import alembic, asyncpg, sqlalchemy; print('All deps OK')"
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 15); do
            if pg_isready -h localhost -U tracker -d tracker_test 2>/dev/null; then
              echo "PostgreSQL ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i)"
            sleep 2
          done
          echo "ERROR: PostgreSQL not ready" && exit 1
      - name: Alembic upgrade
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://tracker:tracker@localhost:5432/tracker_test
      - name: Alembic downgrade to base
        run: alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://tracker:tracker@localhost:5432/tracker_test
      - name: Alembic upgrade (verify roundtrip)
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://tracker:tracker@localhost:5432/tracker_test

  # ── Memory v2 lint (required — STAGE_PLAN Шаг 3, Session 119) ──
  # facts must run before lint: FACTS.json is anchored to HEAD, so any code
  # commit makes it stale.  Regenerating first ensures the freshness check
  # passes on every CI run without requiring a separate commit.
  memory-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m tools.memoryctl facts
      - run: python -m tools.memoryctl lint
      - run: python -m tools.memoryctl facts --check

  # ── Browser E2E smoke (audit P1-4; opt-in heavy dependency) ─────────
  e2e:
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install --upgrade pip setuptools wheel
      - run: pip install ".[dev,e2e]"
      - run: npm ci
      - run: python -m playwright install --with-deps chromium
      - name: Boot app (PostgreSQL) and run E2E smoke
        run: |
          export JWT_SECRET_KEY=ci-test-secret-at-least-32-chars-long
          export CREDENTIALS_ENCRYPTION_KEY=ci-encryption-key-at-least-32-ch
          export CHALLENGE_HMAC_KEY=ci-challenge-key-at-least-32-chars-long
          export DATABASE_URL=postgresql+asyncpg://tracker:tracker@localhost:5432/tracker_test
          for i in $(seq 1 15); do
            if pg_isready -h localhost -U tracker -d tracker_test 2>/dev/null; then break; fi
            sleep 2
          done
          alembic upgrade head
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:8000 python -m pytest tests/e2e/test_browser_smoke.py -q --tb=short
          E2E_BASE_URL=http://127.0.0.1:8000 npm run test:browser:smoke -- --project=desktop-chromium
          kill $APP_PID || true

  # ── Docker image build (P0: production deps must actually install) ──
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t tracker:ci .
      - name: Verify seeds & CLI are inside the image
        run: |
          docker run --rm --entrypoint ls tracker:ci /app/seed_prod.py /app/seed_training.py /app/cli.py
